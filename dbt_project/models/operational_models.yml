version: 2

models:
  - name: silver__operational_users
    description: >
      Cleaned customer accounts exported from the
      transactional PostgreSQL application.
    columns:
      - name: user_id
        data_tests:
          - not_null
          - unique

      - name: email
        data_tests:
          - not_null
          - unique

  - name: silver__operational_orders
    description: >
      Cleaned orders from the live Kairo marketplace.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: user_id
        data_tests:
          - not_null

      - name: total_amount
        data_tests:
          - not_null

  - name: silver__customer_events
    description: >
      Validated behavioral events generated by the
      live Kairo storefront.
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique

      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - product_view
                  - product_search
                  - add_to_cart
                  - remove_from_cart
                  - checkout_started
                  - order_placed

      - name: occurred_at
        data_tests:
          - not_null

  - name: fact_customer_events
    description: >
      Analytics-ready customer journey event fact.
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique

      - name: actor_id
        data_tests:
          - not_null

      - name: actor_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - authenticated
                  - anonymous
