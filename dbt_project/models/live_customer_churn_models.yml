version: 2

models:
  - name: silver__live_customer_churn_scores
    description: >
      Typed live customer churn predictions generated
      from the production-compatible churn model.
    columns:
      - name: user_id
        data_tests:
          - not_null
          - unique

      - name: feature_snapshot_date
        data_tests:
          - not_null

      - name: churn_probability
        data_tests:
          - not_null

      - name: predicted_churn_flag
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 0
                  - 1

      - name: risk_decile
        data_tests:
          - not_null

      - name: risk_segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - high_risk
                  - medium_risk
                  - low_risk

      - name: model_version
        data_tests:
          - not_null

  - name: mart_live_customer_churn_scores
    description: >
      Governed live customer churn mart enriched with
      marketplace customer attributes.
    columns:
      - name: user_id
        data_tests:
          - not_null
          - unique

      - name: email
        data_tests:
          - not_null

      - name: churn_probability
        data_tests:
          - not_null

      - name: scoring_population_size
        data_tests:
          - not_null

      - name: has_customer_match
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - true
