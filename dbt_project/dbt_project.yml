name: 'kairo'
version: '1.0.0'

profile: 'kairo'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  kairo:
    bronze:
      +materialized: view
    silver:
      +materialized: table
    gold:
      +materialized: table

vars:
  analysis_as_of_date: '2025-12-31'
  operational_export_dir: 'warehouse/operational'
  operational_analysis_as_of_date: '2026-07-29'
  live_churn_scores_path: 'analytics/churn_model/data/live_customer_churn_scores.parquet'
